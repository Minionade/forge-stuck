plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '1.0.18'
}

version = mod_version
group = 'net.neoforged.forgestuck'

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

neoForge {
    version = neoforge_version

    runs {
        client {
            client()
        }
    }

    mods {
        forgestuck {
            sourceSet(sourceSets.main)
        }
    }

    unitTest {
        enable()
        testedMod = mods.forgestuck
    }
}

dependencies {
    // ASM, night-config and slf4j are provided by FML at runtime; they are only needed to compile and unit test.
    compileOnly 'org.ow2.asm:asm-tree:9.7'
    compileOnly 'org.ow2.asm:asm-commons:9.7'
    compileOnly 'com.electronwill.night-config:toml:3.8.1'
    compileOnly 'org.slf4j:slf4j-api:2.0.9'

    testImplementation 'org.ow2.asm:asm-tree:9.7'
    testImplementation 'org.ow2.asm:asm-commons:9.7'
    testImplementation 'com.electronwill.night-config:toml:3.8.1'
    testImplementation 'org.slf4j:slf4j-api:2.0.9'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

test {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes([
            'Specification-Title'   : 'forgestuck',
            'Implementation-Title'  : 'Forge Stuck!!',
            'Implementation-Version': project.version,
            'FMLModType'            : 'MOD'
        ])
    }
}
