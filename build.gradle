plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    maven { url = uri('https://maven.neoforged.net/releases') }
    mavenCentral()
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Minimal dependencies for the compatibility bridge project
dependencies {
    implementation 'org.ow2.asm:asm:9.7'
    implementation 'org.ow2.asm:asm-commons:9.7'
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Prevent split-package conflicts during dev runs because build/classes and a copied forgestuck jar can both
// be discovered in the same module layer; temporarily move the built jar out of run/mods while runClient runs,
// then restore it afterward. Use Action instances (not Groovy closures) so the configuration cache is preserved.
import org.gradle.api.Action
import org.gradle.api.Task

tasks.named('runClient').configure(new Action<Task>() {
    @Override
    void execute(Task t) {
        t.doFirst(new Action<Task>() {
            @Override
            void execute(Task ignored) {
                def modsDir = file('run/mods')
                if (!modsDir.exists()) {
                    modsDir.mkdirs()
                }
                def backupDir = file("${buildDir}/tmp/forgestuck-backup")
                backupDir.mkdirs()

                modsDir.listFiles()?.findAll { file ->
                    file.name.toLowerCase(java.util.Locale.ROOT).startsWith('forgestuck')
                }?.each { file ->
                    def target = new File(backupDir, file.name)
                    if (target.exists()) {
                        target.delete()
                    }
                    println "[Forge Stuck!!] Temporarily moving ${file.name} out of run/mods for dev-launch compatibility"
                    file.renameTo(target)
                }
            }
        })

        t.doLast(new Action<Task>() {
            @Override
            void execute(Task ignored) {
                def modsDir = file('run/mods')
                def backupDir = file("${buildDir}/tmp/forgestuck-backup")
                if (!modsDir.exists()) {
                    modsDir.mkdirs()
                }

                if (backupDir.exists()) {
                    backupDir.listFiles()?.each { file ->
                        def target = new File(modsDir, file.name)
                        if (target.exists()) {
                            target.delete()
                        }
                        println "[Forge Stuck!!] Restoring ${file.name} to run/mods after dev launch"
                        file.renameTo(target)
                    }
                    backupDir.deleteDir()
                }
            }
        })
    }
})

// Standard publishing and IDEA settings
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
